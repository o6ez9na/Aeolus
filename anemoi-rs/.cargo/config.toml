# The MIPS musl targets are tier 3: no prebuilt std (build with nightly and
# -Zbuild-std) and, unlike the tier-2 musl targets, dynamic linking by default.
# A router has no libgcc_s to load, so link statically; and since rustc ships
# no self-contained crt objects for these targets, let the linker (zig's musl)
# provide crt1.o and libc.
[target.mipsel-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=no"]

[target.mips-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=no"]
