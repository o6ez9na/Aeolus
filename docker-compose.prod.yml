# Production overlay: terminate TLS at Caddy and keep everything else off the
# public interface.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  frontend:
    # Caddy is the only thing that should be reachable from outside.
    ports: !reset []

  backend:
    # Remote agents reach gRPC through Caddy on 443 (see deploy/Caddyfile), so
    # nothing here is published.
    ports: !reset []

  caddy:
    # Stock Caddy plus the layer4 module; see deploy/caddy/Dockerfile.
    build: ./deploy/caddy
    image: aeolus-caddy:local
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      AEOLUS_DOMAIN: ${AEOLUS_DOMAIN:?set AEOLUS_DOMAIN in .env}
      AEOLUS_GRPC_SNI: ${AEOLUS_GRPC_SNI:-anemoi-grpc}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
