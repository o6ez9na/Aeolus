services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeolus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aeolus}
    volumes:
      # Postgres 18 images want the mount one level up, at /var/lib/postgresql,
      # so pg_upgrade --link stays inside a single mount point.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeolus} -d ${POSTGRES_DB:-aeolus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: panel/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AEOLUS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aeolus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aeolus}
      AEOLUS_SECRET_KEY: ${AEOLUS_SECRET_KEY:?set AEOLUS_SECRET_KEY in .env}
      # Encrypts CA and client private keys at rest. Losing it means re-issuing
      # every certificate, so it is separate from the session secret.
      AEOLUS_PKI_SECRET: ${AEOLUS_PKI_SECRET:?set AEOLUS_PKI_SECRET in .env}
      AEOLUS_DEBUG: ${AEOLUS_DEBUG:-false}
      AEOLUS_FIRST_ADMIN_USERNAME: ${AEOLUS_FIRST_ADMIN_USERNAME:-admin}
      AEOLUS_FIRST_ADMIN_PASSWORD: ${AEOLUS_FIRST_ADMIN_PASSWORD:-}
      # Used as the address of the panel's own node, which registers itself.
      AEOLUS_DOMAIN: ${AEOLUS_DOMAIN:-}
      AEOLUS_PUBLIC_HOST: ${AEOLUS_PUBLIC_HOST:-}
      AEOLUS_MASTER_OPENVPN_PORT: ${AEOLUS_VPN_PORT:-1194}
      AEOLUS_VPN_SUBNET: ${AEOLUS_VPN_SUBNET:-10.8.0.0}
    expose:
      - "8000"
      - "50051"
    volumes:
      # The backend writes the OpenVPN bundle the openvpn container consumes.
      - openvpn-config:/etc/openvpn/aeolus

  frontend:
    build: ./panel/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PANEL_PORT:-8080}:80"

  # The panel host is a node: this is its OpenVPN. Config and certificates are
  # written into the shared volume by the backend on startup.
  openvpn:
    build: ./deploy/openvpn
    restart: unless-stopped
    depends_on:
      - backend
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      AEOLUS_VPN_SUBNET: ${AEOLUS_VPN_SUBNET:-10.8.0.0}
      AEOLUS_VPN_TCP_SUBNET: ${AEOLUS_VPN_TCP_SUBNET:-10.9.0.0}
      AEOLUS_VPN_MASK_BITS: ${AEOLUS_VPN_MASK_BITS:-24}
    ports:
      - "${AEOLUS_VPN_PORT:-1194}:1194/udp"
      - "${AEOLUS_VPN_TCP_PORT:-8443}:8443/tcp"
    volumes:
      - openvpn-config:/etc/openvpn/aeolus
      # status.log lives here; the agent reads it to report sessions.
      - openvpn-run:/run/openvpn

  # The panel's own node agent. Remote nodes run this same image against
  # AEOLUS_DOMAIN with a token from the panel.
  anemoi:
    build:
      context: .
      dockerfile: anemoi/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ANEMOI_PANEL: backend:50051
      ANEMOI_PANEL_API: http://backend:8000
      ANEMOI_INTERVAL: ${ANEMOI_INTERVAL:-15}
    volumes:
      - openvpn-config:/etc/openvpn/aeolus
      - anemoi-state:/var/lib/anemoi
      - openvpn-run:/run/openvpn:ro

volumes:
  postgres-data:
  openvpn-config:
  openvpn-run:
  anemoi-state:
